# Lint rule: Flag bare prisma.client/product calls that should use scopedDb() for location safety.
# Some violations are permanent-by-design and excluded:
# - contractService.ts: Uses manual ownership check (product.locationId !== input.locationId).
# - occupancyQuery.ts: maintenanceBufferForProduct() has no locationId input; caller verifies.
# - productService.ts: createProduct() non-HTTP; listProductsForLocation() already filtered;
#   availabilityByProductId() is batch lookup with caller-verified IDs.
# Tasks 12-13 will migrate remaining violations (Client/Product CRUD methods).
# See docs/superpowers/specs/2026-07-31-location-scoping-design.md §4.

id: no-unscoped-location-model
language: TypeScript
message: >-
  Use scopedDb(locationId) from server/src/db/scopedClient.ts instead of the
  bare prisma client for Client/Product — see docs/superpowers/specs/2026-07-31-location-scoping-design.md.
  If this call site genuinely has no HTTP session (e.g. a token-based lookup
  that already has its own locationId in hand), route it through
  scopedDb(knownLocationId) instead of prisma directly.
severity: error
rule:
  any:
    - pattern: prisma.client.$METHOD($$$ARGS)
    - pattern: prisma.product.$METHOD($$$ARGS)
files:
  - "src/**/*.ts"
ignores:
  - "src/db/scopedClient.ts"
  - "src/**/*.test.ts"
  - "src/generated/**"
  # Permanent-by-design violations (documented above); see sgconfig.yml for rationale.
  - "src/services/contractService.ts"
  - "src/services/occupancyQuery.ts"
