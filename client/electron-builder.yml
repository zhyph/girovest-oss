appId: com.dressstore.app
productName: Dress Store
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../server/dist-bundle/server-bundle.mjs
    to: server/server-bundle.mjs
  - from: ../server/node_modules
    to: server/node_modules
  - from: ../node_modules
    to: node_modules
  - from: ../server/prisma
    to: server/prisma
    filter:
      - '**/*'
      - '!**/*.db'
      - '!**/*.db-journal'
  - from: ../server/prisma.config.ts
    to: server/prisma.config.ts
win:
  target: nsis
linux:
  target: AppImage
