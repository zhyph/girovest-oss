appId: com.girovest.app
productName: Girovest
directories:
  output: release
# The three build targets are self-contained: electron-vite bundles the main
# process (including electron-updater/electron-log — see the externalization
# comment in electron.vite.config.ts), the preload, and the renderer into
# out/. Without the explicit exclusion, electron-builder still auto-packs the
# production node_modules tree into app.asar (~85MB / 18k files of React,
# Radix, etc. that Vite already compiled into out/renderer) — dead weight in
# every download and delta update.
files:
  - out/**/*
  - package.json
  - '!node_modules'
# The server side of the app ships as two esbuild bundles plus an explicit
# ALLOWLIST of the only packages they can't inline (native addons and their
# loaders) -- verified by grepping the built bundles for surviving bare
# require()/import specifiers. Everything else (express, zod, the generated
# Prisma client, ...) is already inside the bundles.
#
# History: this used to copy the whole root and server node_modules trees
# (~450MB, tens of thousands of files, even after a first round of
# exclusions), which made the Windows installer take ~15 minutes -- NSIS
# extracts and Defender scans every file individually. It also forced a
# second full copy into userData at first launch (see cleanupLegacyServerRuntime
# in electron/main.ts). The bulk of it existed only so `prisma migrate
# deploy` (the CLI + its engines, ~250MB) could run at startup; that job is
# now done by server/src/db/migrationRunner.ts, which needs nothing beyond
# better-sqlite3 and the migration .sql files below. Keep this an allowlist:
# a denylist over node_modules silently regrows with every new devDependency.
extraResources:
  - from: ../server/dist-bundle/server-bundle.mjs
    to: server/server-bundle.mjs
  - from: ../server/dist-bundle/migrate.mjs
    to: server/migrate.mjs
  - from: ../server/node_modules
    to: server/node_modules
    # bcrypt loads its compiled addon through node-gyp-build; better-sqlite3
    # through bindings (which needs file-uri-to-path). The compiled .node
    # files land in build/ via electron-rebuild (see the prepackage hook in
    # package.json); prebuilds/ carries bcrypt's fallback binaries. C/C++
    # sources and sqlite's amalgamation only matter at rebuild time, never at
    # runtime -- excluded.
    filter:
      - 'bcrypt/**'
      - 'better-sqlite3/**'
      - 'bindings/**'
      - 'file-uri-to-path/**'
      - 'node-gyp-build/**'
      - '!bcrypt/{src,test,examples}/**'
      - '!better-sqlite3/{src,deps}/**'
      - '!better-sqlite3/build/Release/obj/**'
      - '!**/build/Release/obj.target/**'
  # Only the raw migration scripts: the runner walks this directory itself.
  # The schema files and postgresql/ tree are CLI/dev-time inputs.
  - from: ../server/prisma/sqlite/migrations
    to: server/prisma/sqlite/migrations
    filter:
      - '**/migration.sql'
win:
  target: nsis
linux:
  target: AppImage
# The app is Portuguese-only (client/src/i18n.ts hardcodes lng/fallbackLng to
# pt-BR, no language switcher), so Chromium's own locale strings (spellcheck,
# native context menus, etc.) never need the other ~54 languages electron
# ships by default -- electron-builder deletes their .pak files from the
# packaged app, trimming another ~40MB/~50 files regardless of platform.
electronLanguages:
  - pt-BR
publish:
  provider: github
  # Upload target for CI only. Both this repo and the source repo are private:
  # electron-updater can't read private release assets without shipping a
  # GitHub token inside the app, so installed clients never talk to GitHub
  # directly. They go through a Cloudflare Worker that holds the PAT
  # server-side and authenticates the app by product key.
  #
  # electron-builder still bakes this block into the package as
  # app-update.yml, and that file is deliberately dead weight at runtime:
  # electron/updater.ts calls setFeedURL() with the proxy URL before the first
  # check, which replaces the provider this file would have configured. It is
  # kept as github/... anyway because electron-builder reads the same block to
  # know where to upload, and pointing it at the proxy would break publishing.
  # If updater.ts ever stops calling setFeedURL, updates go silently dead
  # (404s against a private repo) rather than leaking — see the warn-and-bail
  # branch there.
  owner: zhyph
  repo: girovest-releases
  # Draft, not published: artifacts land attached to a draft release for a
  # human to review and hit "Publish" on — not auto-live the moment CI runs.
  # electron-updater only ever sees published releases.
  releaseType: draft
