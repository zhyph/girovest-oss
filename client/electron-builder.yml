appId: com.girovest.app
productName: Girovest
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../server/dist-bundle/server-bundle.mjs
    to: server/server-bundle.mjs
  - from: ../server/node_modules
    to: server/node_modules
  - from: ../node_modules
    to: node_modules
    # npm workspaces links each workspace package into the shared root
    # node_modules by its package name -- girovest-client is a symlink back
    # to ../client itself. Copying it here recurses straight into this same
    # packaging run's own in-progress output (client/release/...), which
    # only failed on Windows (a real CI failure, not theoretical): infinite
    # path nesting until MAX_PATH is hit. Neither workspace-self-link is
    # needed at runtime (server/node_modules already ships separately;
    # client's own source has no business inside the packaged server's
    # node_modules), so both are excluded outright.
    #
    # The packages below are excluded because this whole entry only exists so
    # the packaged server-bundle.mjs can resolve its externals (bcrypt,
    # better-sqlite3, pg-native) and the handful of hoisted workspace deps it
    # doesn't inline (effect, dotenv, zod, cors, ...) -- see the comment on
    # ensureWritableServerRuntime in main.ts. None of these are that: they're
    # build/dev/test-only tooling (confirmed via grep: nothing under
    # server/src or client/src imports them), and together they're ~376MB of
    # the ~826MB this entry used to copy -- the largest single contributor to
    # a slow Windows install, since NSIS extracts and Defender scans every
    # file individually.
    #   - electron: the dev-time Electron binary itself. The packaged app
    #     already *is* Electron; it never loads a second copy from resources.
    #   - electron-winstaller: builds Squirrel (.exe) installers. This project
    #     only ever uses the nsis Windows target (see win.target below).
    #   - playwright / playwright-core: e2e test runner, dev-only.
    #   - lightningcss-linux-x64-gnu: a Linux-only native binary pulled in by
    #     Tailwind's build step -- irrelevant after the CSS is already
    #     compiled into client/out, and wrong-platform on a Windows/macOS
    #     build regardless.
    filter:
      - '**/*'
      - '!girovest-client'
      - '!girovest-client/**'
      - '!girovest-server'
      - '!girovest-server/**'
      - '!electron'
      - '!electron/**'
      - '!electron-winstaller'
      - '!electron-winstaller/**'
      - '!playwright'
      - '!playwright/**'
      - '!playwright-core'
      - '!playwright-core/**'
      - '!lightningcss-linux-x64-gnu'
      - '!lightningcss-linux-x64-gnu/**'
  - from: ../server/prisma
    to: server/prisma
    filter:
      - '**/*'
      - '!**/*.db'
      - '!**/*.db-journal'
  - from: ../server/prisma.config.ts
    to: server/prisma.config.ts
win:
  target: nsis
linux:
  target: AppImage
# The app is Portuguese-only (client/src/i18n.ts hardcodes lng/fallbackLng to
# pt-BR, no language switcher), so Chromium's own locale strings (spellcheck,
# native context menus, etc.) never need the other ~54 languages electron
# ships by default -- electron-builder deletes their .pak files from the
# packaged app, trimming another ~40MB/~50 files regardless of platform.
electronLanguages:
  - pt-BR
publish:
  provider: github
  # Upload target for CI only. Both this repo and the source repo are private:
  # electron-updater can't read private release assets without shipping a
  # GitHub token inside the app, so installed clients never talk to GitHub
  # directly. They go through a Cloudflare Worker that holds the PAT
  # server-side and authenticates the app by product key.
  #
  # electron-builder still bakes this block into the package as
  # app-update.yml, and that file is deliberately dead weight at runtime:
  # electron/updater.ts calls setFeedURL() with the proxy URL before the first
  # check, which replaces the provider this file would have configured. It is
  # kept as github/... anyway because electron-builder reads the same block to
  # know where to upload, and pointing it at the proxy would break publishing.
  # If updater.ts ever stops calling setFeedURL, updates go silently dead
  # (404s against a private repo) rather than leaking — see the warn-and-bail
  # branch there.
  owner: zhyph
  repo: girovest-releases
  # Draft, not published: artifacts land attached to a draft release for a
  # human to review and hit "Publish" on — not auto-live the moment CI runs.
  # electron-updater only ever sees published releases.
  releaseType: draft
