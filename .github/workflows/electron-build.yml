name: Build Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# electron-builder needs contents:write to create/update the draft release
# and upload assets to it (GITHUB_TOKEN is otherwise read-only by default).
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron's own binary download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron
          key: ${{ matrix.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build server
        run: npm run build --workspace=server

      - name: Prune server to production dependencies
        run: npm ci --omit=dev --workspace=server

      - name: Restore client build tooling
        # npm workspaces share one root node_modules tree, so the prune above
        # (`npm ci --omit=dev --workspace=server`) strips devDependencies for
        # the whole tree, not just server/ -- it removes client's electron,
        # electron-vite, and electron-builder along with server's tsx/vitest.
        # Verified locally: without this step, the next two steps fail with
        # "command not found" because electron-vite/electron-builder are gone.
        # This reinstalls only client's devDependencies and leaves the
        # already-pruned server/node_modules production-only tree untouched.
        run: npm install --workspace=client

      - name: Build client renderer/main/preload
        run: npm run electron:build --workspace=client

      - name: Package with electron-builder
        # `npm run package`'s own `prepackage` hook (client/package.json)
        # runs `bundle-server` (esbuild-bundles server/dist/server.js into a
        # single file) and `rebuild-server-natives` automatically before
        # electron-builder runs -- the latter re-targets the bcrypt/
        # better-sqlite3 binaries selected by the "Prune server to production
        # dependencies" step above (built for standalone Node) to Electron's
        # bundled Node/V8 ABI, which client/electron/main.ts spawns the server
        # under (ELECTRON_RUN_AS_NODE=1). Different NODE_MODULE_VERSION
        # otherwise -- guaranteed dlopen crash. A separate explicit step for
        # this used to exist here too, running the same rebuild twice.
        #
        # --publish onTag: only actually publishes (creates/updates the draft
        # release + uploads assets) when this run was triggered by a `v*` tag
        # push (this workflow's own trigger, above) -- a manual
        # workflow_dispatch run still builds and uploads to the Actions run's
        # own artifacts, but doesn't touch the Releases page.
        run: npm run package --workspace=client -- --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dress-store-app-${{ matrix.os }}
          path: |
            client/release/*.exe
            client/release/*.AppImage
          if-no-files-found: error
