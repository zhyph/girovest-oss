name: Build Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Publishing goes to the separate releases repo (see the publish block in
# client/electron-builder.yml) via the RELEASES_TOKEN PAT — the built-in
# GITHUB_TOKEN can't write to a different repo, so this workflow needs no
# write access to this one. That repo is private: installed apps never read it
# directly, they go through the update proxy in infra/update-proxy, which holds
# a read-only PAT server-side. RELEASES_TOKEN therefore needs write access to a
# private repo (fine-grained: Contents read+write scoped to girovest-releases).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron's own binary download
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron
          key: ${{ matrix.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build server
        run: npm run build --workspace=server

      - name: Prune server to production dependencies
        run: npm ci --omit=dev --workspace=server

      - name: Restore client build tooling
        # npm workspaces share one root node_modules tree, so the prune above
        # (`npm ci --omit=dev --workspace=server`) strips devDependencies for
        # the whole tree, not just server/ -- it removes client's electron,
        # electron-vite, and electron-builder along with server's tsx/vitest.
        # Verified locally: without this step, the next two steps fail with
        # "command not found" because electron-vite/electron-builder are gone.
        # This reinstalls only client's devDependencies and leaves the
        # already-pruned server/node_modules production-only tree untouched.
        run: npm install --workspace=client

      - name: Fail early if a tag build has no update-proxy coordinates
        # A tag build is a build that gets published and installed. Without
        # these two values electron.vite.config.ts bakes empty strings into the
        # main bundle, updater.ts takes its warn-and-return branch, and the
        # installer that reaches the shops is valid, installable, and can never
        # update itself again. Nothing downstream catches that: the CI stays
        # green, the draft release is complete, and even the post-release curl
        # from docs/release-checklist.md passes, because it exercises the
        # Worker and not the app. Manual workflow_dispatch runs are exempt on
        # purpose — they exist to check that the build itself still works and
        # they never publish (--publish onTag).
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          missing=""
          [ -n "${{ secrets.GIROVEST_UPDATE_URL }}" ] || missing="$missing GIROVEST_UPDATE_URL"
          [ -n "${{ secrets.GIROVEST_UPDATE_KEY }}" ] || missing="$missing GIROVEST_UPDATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing. Cadastre em Settings > Secrets and variables > Actions e refaca a tag. Sem eles o instalador publicado nunca se atualiza." >&2
            exit 1
          fi

      - name: Build client renderer/main/preload
        # electron-vite's `define` for the main target reads these two from the
        # environment (client/electron.vite.config.ts) and substitutes them as
        # literals into out/main. This is the only step where they matter:
        # electron-builder just packages what this step produced. Both are
        # secrets rather than variables even though the URL is not sensitive,
        # so the pair stays in one place and neither leaks into the run log.
        env:
          GIROVEST_UPDATE_URL: ${{ secrets.GIROVEST_UPDATE_URL }}
          GIROVEST_UPDATE_KEY: ${{ secrets.GIROVEST_UPDATE_KEY }}
        run: npm run electron:build --workspace=client

      - name: Package with electron-builder
        # `npm run package`'s own `prepackage` hook (client/package.json)
        # runs `bundle-server` (esbuild-bundles server/dist/server.js into a
        # single file) and `rebuild-server-natives` automatically before
        # electron-builder runs -- the latter re-targets the bcrypt/
        # better-sqlite3 binaries selected by the "Prune server to production
        # dependencies" step above (built for standalone Node) to Electron's
        # bundled Node/V8 ABI, which client/electron/main.ts spawns the server
        # under (ELECTRON_RUN_AS_NODE=1). Different NODE_MODULE_VERSION
        # otherwise -- guaranteed dlopen crash. A separate explicit step for
        # this used to exist here too, running the same rebuild twice.
        #
        # --publish onTag: only actually publishes (creates/updates the draft
        # release + uploads assets) when this run was triggered by a `v*` tag
        # push (this workflow's own trigger, above) -- a manual
        # workflow_dispatch run still builds and uploads to the Actions run's
        # own artifacts, but doesn't touch the Releases page.
        run: npm run package --workspace=client -- --publish onTag
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/upload-artifact@v7
        # Tag builds already ship these installers as release assets on the
        # releases repo, and release assets don't count against the Actions
        # storage quota; duplicating them as run artifacts at the default
        # 90-day retention is what exhausted the account's 0.5 GB of it. Keep artifacts only for manual dispatch runs,
        # which don't publish anywhere else, and expire them fast.
        if: github.event_name == 'workflow_dispatch'
        with:
          name: girovest-${{ matrix.os }}
          path: |
            client/release/*.exe
            client/release/*.AppImage
          if-no-files-found: error
          retention-days: 3
